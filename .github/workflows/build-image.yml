name: Build Docker Image

on:
  push:
  pull_request:
  workflow_dispatch:      # Manual trigger whenever needed

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: misc/ci.dockerfile
          target: builder
          push: true
          tags: |
            ghcr.io/dreadnought-robotics/mira:latest
            ghcr.io/dreadnought-robotics/mira:${{ github.sha }}
          cache-from: type=gha,scope=ros-builder
          cache-to: type=gha,scope=ros-builder,mode=max