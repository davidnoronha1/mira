name: Build Check

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release configuration
        run: |
          python -m pip install PyYAML
          python misc/tools/check_config.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: misc/ci.dockerfile
          target: builder
          push: false
          cache-from: type=gha,scope=ros-builder
          cache-to: type=gha,scope=ros-builder,mode=max