services:
  mira:
    image: mira
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUVSLAM_WHEEL_URL: "${CUVSLAM_WHEEL_URL:-}"
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix
    privileged: true
    user: "${_UID}:${_GID}"
    network_mode: host
    working_dir: /workspace
    entrypoint: /bin/bash
    environment:
      DISPLAY: "${DISPLAY:-}"
      MIRA_MIDDLEWARE: "${MIRA_MIDDLEWARE:-}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      MIRA_ZENOH_ENDPOINT: "${MIRA_ZENOH_ENDPOINT:-}"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  mira-nogpu:
    image: mira
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    volumes:
      - .:/workspace
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix
    privileged: true
    user: "${_UID}:${_GID}"
    network_mode: host
    working_dir: /workspace
    entrypoint: /bin/bash
    environment:
      DISPLAY: "${DISPLAY:-}"
      MIRA_MIDDLEWARE: "${MIRA_MIDDLEWARE:-}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      MIRA_ZENOH_ENDPOINT: "${MIRA_ZENOH_ENDPOINT:-}"
