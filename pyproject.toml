[project]
name = "mira"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "catkin-pkg>=1.0.0",
  "empy<4",
  "lark-parser>=0.12.0",
  "numpy>=2.3.2",
  "opencv-python>=4.11.0.86",
  "plotext>=5.3.2",
  "pymavlink>=2.4.49",
  "pyserial>=3.5",
  "pyyaml>=6.0.2",
  "textual>=8.0.0",
  "textual-plotext>=1.0.1",
  "tk>=0.1.0",
  "opencv-contrib-python",
  "mavproxy>=1.8.74",
  "future>=1.0.0",
]

[project.optional-dependencies]
vision = [
  "torch",
  "torchvision",
  "ultralytics>=8.4.38",
  "onnxruntime-gpu>=1.24.4",
]

vision-nogpu = [
  "torch",
  "torchvision",
  "ultralytics>=8.4.38",
  "onnxruntime>=1.24.4",
]

[tool.uv]
conflicts = [
  [
    { extra = "vision" },
    { extra = "vision-nogpu" },
  ],
]

[[tool.uv.index]]
name = "jetson-ai-lab"
# cu126 only ships cp310 wheels; cu129 is the lowest Jetson CUDA index with cp312 torch/torchvision builds.
url = "https://pypi.jetson-ai-lab.io/jp6/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]

torch = [
  # Jetson CUDA wheels for the vision extra
  { index = "jetson-ai-lab", extra = "vision", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },

  # CPU wheels for vision-nogpu
  { index = "pytorch-cpu", extra = "vision-nogpu" },

  # CPU wheels for vision on non-Jetson systems
  { index = "pytorch-cpu", extra = "vision", marker = "platform_machine != 'aarch64' or sys_platform != 'linux'" },
]

torchvision = [
  # Jetson CUDA wheels for the vision extra
  { index = "jetson-ai-lab", extra = "vision", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },

  # CPU wheels for vision-nogpu
  { index = "pytorch-cpu", extra = "vision-nogpu" },

  # CPU wheels for vision on non-Jetson systems
  { index = "pytorch-cpu", extra = "vision", marker = "platform_machine != 'aarch64' or sys_platform != 'linux'" },
]