[project]
name = "mira"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "catkin-pkg>=1.0.0",
  "empy<4",
  "lark-parser>=0.12.0",
  # ROS Jazzy's cv_bridge (and other system extensions) is built against
  # Ubuntu 24.04's NumPy 1.26; NumPy 2 crashes it on import. OpenCV >= 4.12
  # requires NumPy 2, so it is held back too.
  "numpy>=1.26,<2",
  "opencv-python>=4.11.0.86,<4.12",
  "plotext>=5.3.2",
  "pymavlink>=2.4.49",
  "pyserial>=3.5",
  "pyyaml>=6.0.2",
  "textual>=8.0.0",
  "textual-plotext>=1.0.1",
  "tk>=0.1.0",
  "opencv-contrib-python<4.12",
  "mavproxy>=1.8.74",
  "onnxruntime>=1.24.4",
  "future>=1.0.0",
]

[project.optional-dependencies]
# YOLO via ultralytics pulls in PyTorch (~4 GB with CUDA); install with
# `uv sync --extra vision` or build the image with MIRA_EXTRAS=vision.
vision = ["ultralytics>=8.4.38"]

# [tool.uv]
# torch-backend = "auto"
[tool.uv]
#torch-backend = "auto"

[[tool.uv.index]]
name = "jetson-ai-lab"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[tool.uv.sources]
torch = [
  # CUDA 12.6 wheel — only resolved on linux/aarch64 (Jetson Orin)
  { index = "jetson-ai-lab", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
]
torchvision = [
  { index = "jetson-ai-lab", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
]
