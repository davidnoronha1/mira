/**:
  ros__parameters:
    detectors:
    - yolo
    consumers:
    - objects
    image_source: ros2:///mira/sensors/camera/front/image_raw
    camera_info_topic: /mira/sensors/camera/front/camera_info
    camera_frame: camera_front_optical
    rate: 30.0
    max_frame_age: 0.5
    publish_image: true
    preview_rate: 5.0
    preview_width: 640
    visualize: false
    depth_topic: ''
    depth_max_skew: 0.1
    yolo:
      model_name: best.onnx
      device: CPU
      conf_threshold: 0.5
      nms_threshold: 0.4
      input_height: 640
      input_width: 640
      rate: 15.0
