/**:
  ros__parameters:
    simulation: true
    use_sim_time: true
    detectors:
    - yolo
    consumers:
    - depth_targets
    - objects
    - obstacle_distance
    image_source: ros2:///mira/sensors/camera/front/image_raw
    camera_info_topic: /mira/sensors/camera/front/camera_info
    camera_frame: front_camera_depth_optical
    depth_topic: /mira/sensors/camera/front/depth/image_raw
    depth_max_skew: 0.01
    gazebo_boxes:
      classes:
      - ''
      - gate
      - qual gate
      - flare
      - red pole
      - yellow pole
      - blue pole
      - blue_bucket
      - red_bucket
      - golf_ball
      - mat
    yolo:
      model_name: best.onnx
    depth_targets:
      target_class: dock
      min_depth: 0.1
      max_depth: 20.0
